server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:emaildb;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-address: ${SENDGRID_FROM:}
  from-name: ${SENDGRID_FROM_NAME:}
  from.name: ${SENDGRID_FROM_NAME:}
