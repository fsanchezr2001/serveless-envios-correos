# Render Blueprint (infrastructure-as-code) for the email flow:
#   Angular (served from Spring Boot static/) -> Spring Boot -> SendGrid -> end user
#
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repository.
# Secrets are declared with `sync: false`: Render prompts for the value in the
# dashboard and never stores it in this file, so nothing sensitive is committed.
#
# A single Docker service serves both the Angular static build and the Spring Boot API.
services:
  - type: web
    name: envio-correo
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Spring Boot reads the injected PORT env var; see application.yml.
    healthCheckPath: /api/emails/health
    envVars:
      # SendGrid API key with "Mail Send" restricted access only.
      - key: SENDGRID_API_KEY
        sync: false
      # Must equal the verified Single Sender / Domain Authentication address.
      # Verified: fsanchezr2001@gmail.com
      - key: SENDGRID_FROM
        sync: false
      # Display name for the sender.
      - key: SENDGRID_FROM_NAME
        sync: false
      # Optional: H2 file-backed DB. On Render free plan the disk is ephemeral;
      # set jdbc:h2:mem:emaildb for transient data or attach a Persistent Disk
      # and use jdbc:h2:file:/data/emaildb for durable storage.
      - key: DB_URL
        sync: false
      # Browser origin that is allowed to call the API. In production this is the
      # Cloudflare Pages URL, e.g. https://envio-correo.pages.dev. Comma-separated
      # for multiple origins. Read by WebConfig.java.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
